<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b2640">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가계부">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<title>우리집 가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 모바일 한 화면 앱 — 상단 요약, 가운데 스크롤 내용, 하단 탭 */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --ink:#18223a; --muted:#666f80; --line:#dfe2e8;
  --accent:#1b2640; --accent-soft:#e6e9f1;
  --inc:#1f7a4d; --exp:#c2412d; --fix:#9a5a12; --inv:#3d5bb0;
  --font-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-display:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1219; --surface:#181d29; --ink:#eceef3; --muted:#9aa1b0; --line:#2a3142;
    --accent:#e8b85c; --accent-soft:#33291a;
    --inc:#5fcb8f; --exp:#f07a64; --fix:#e0a55a; --inv:#8aa4f0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1219; --surface:#181d29; --ink:#eceef3; --muted:#9aa1b0; --line:#2a3142;
  --accent:#e8b85c; --accent-soft:#33291a;
  --inc:#5fcb8f; --exp:#f07a64; --fix:#e0a55a; --inv:#8aa4f0; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;touch-action:pan-x pan-y}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.app{display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto}
header.top{padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:12px}
header.top h1{font-family:var(--font-display);font-size:18px;font-weight:700;margin:0;flex:1;text-wrap:balance}
.sync{font-size:12px;color:var(--muted)}
main{flex:1;overflow-y:auto;padding:4px 12px 96px;display:flex;flex-direction:column;gap:10px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;width:100%;max-width:760px}
nav.tabs a{flex:1;text-align:center;padding:10px 0 12px;font-size:13px;color:var(--muted);text-decoration:none;font-weight:500;border-top:2px solid transparent}
nav.tabs a[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h2{font-size:15px;margin:0 0 10px;font-weight:600;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.mnav{display:flex;align-items:center;gap:8px}
.mnav .label{flex:1;text-align:center;font-family:var(--font-display);font-size:20px;font-weight:700}
.mnav button.label{border:0;background:none;color:var(--ink);padding:6px 0;border-radius:10px;cursor:pointer}
.mnav button.label:hover{background:var(--accent-soft)}
.mnav button.label .caret{font-size:13px;color:var(--muted);margin-left:6px;font-weight:500}
.cashbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent);color:var(--surface);border-radius:var(--r);padding:14px 16px}
.cashbar .k{font-size:13px;opacity:.85}
.cashbar b{font-size:22px;font-weight:700}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mgrid button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;gap:2px;align-items:center;color:var(--ink)}
.mgrid button .mm{font-size:16px;font-weight:600}
.mgrid button .ms{font-size:11.5px;color:var(--muted)}
.mgrid button.empty{opacity:.45}
.mgrid button[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mgrid button.now .mm::after{content:" ·";color:var(--accent)}
.ynav{display:flex;align-items:center;gap:8px}
.ynav b{flex:1;text-align:center;font-size:18px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;font-size:18px;line-height:1}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;border-left:4px solid var(--c,var(--line))}
.tile .k{font-size:12.5px;color:var(--muted)}
.tile .v{font-size:18px;font-weight:700}
.tile.big{grid-column:1/-1}
.tile.big .v{font-size:24px}
.c-inc{--c:var(--inc)} .c-exp{--c:var(--exp)} .c-fix{--c:var(--fix)} .c-inv{--c:var(--inv)} .c-acc{--c:var(--accent)}
.t-수입{color:var(--inc)} .t-변동지출{color:var(--exp)} .t-고정지출{color:var(--fix)} .t-재테크{color:var(--inv)}
.chip{display:inline-flex;align-items:center;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.chip.t-수입{background:color-mix(in srgb,var(--inc) 15%,transparent)}
.chip.t-변동지출{background:color-mix(in srgb,var(--exp) 14%,transparent)}
.chip.t-고정지출{background:color-mix(in srgb,var(--fix) 16%,transparent)}
.chip.t-재테크{background:color-mix(in srgb,var(--inv) 15%,transparent)}
.t-자산이동{color:var(--ink)} .chip.t-자산이동{background:color-mix(in srgb,var(--ink) 10%,transparent)}
.budget{display:flex;flex-direction:column;gap:10px}
.brow{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.over{background:var(--exp)}
.bar i.warn{background:#e9b949}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .bar i.warn{background:#ffa64d} :root:not([data-theme="light"]) .bar i.over{background:#ff5a4e} }
:root[data-theme="dark"] .bar i.warn{background:#ffa64d}
:root[data-theme="dark"] .bar i.over{background:#ff5a4e}
.brow .amt{text-align:right;font-size:12.5px;color:var(--muted)}
.brow .amt b{color:var(--ink);font-weight:600}
.day{display:flex;flex-direction:column}
.dayh{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:10px 2px 4px;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.row:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.row .memo{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:12px;color:var(--muted)}
.row .a{font-weight:600}
.list-plain{display:flex;flex-direction:column}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:76px;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:14px 20px;font-weight:600;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
:root[data-theme="dark"] .fab{color:#0d1a16}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fab{color:#0d1a16}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.danger{color:var(--exp)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.filters{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.filters .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;color:var(--ink);font-size:15px;min-width:0;width:100%}
.sumline{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.sumline span b{font-weight:600}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:500}
tr.sel td{background:var(--accent-soft)}
tr.click{cursor:pointer}
.scroll-x{overflow-x:auto}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.empty{padding:20px 4px;text-align:center;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.banner{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.banner p{margin:0}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:9px 0;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px}
.chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
dialog{border:0;padding:0;border-radius:16px 16px 0 0;width:100%;max-width:560px;margin:auto auto 0;background:var(--surface);color:var(--ink);max-height:92%}
@media (min-width:600px){dialog{border-radius:16px;margin:auto}}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg{display:flex;flex-direction:column;gap:14px;padding:18px 16px 20px}
.dlg h3{margin:0;font-size:17px}
.dlg .acts{display:flex;gap:8px;flex-wrap:wrap}
.dlg .acts .grow{flex:1}
.amt-in{font-size:24px!important;font-weight:700;text-align:right}
.edit-grid{display:grid;grid-template-columns:1fr 110px auto;gap:6px;align-items:center}
.edit-grid.rec{grid-template-columns:88px 1fr 100px auto}
.edit-grid input,.edit-grid select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 8px;font-size:14px;min-width:0;width:100%;color:var(--ink)}
.grp-title{font-size:12.5px;color:var(--muted);margin:10px 0 4px;font-weight:600}
.chart svg{display:block;width:100%;height:auto}
.chart rect[data-hm]{cursor:pointer}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:20;padding:24px}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 22px;max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.login-card h2{margin:0;font-size:22px}
.login-card p{margin:0;color:var(--muted);font-size:14px}
.fab{bottom:calc(76px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:10}
.reclist label{display:grid;grid-template-columns:auto 1fr 110px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.reclist input[type=text]{border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:right;background:var(--surface);width:100%;color:var(--ink)}
.brows{display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow:auto;padding:2px}
.brow{border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.brow-top{display:grid;grid-template-columns:1.1fr 1fr auto;gap:6px;align-items:center}
.brow-bot{display:grid;grid-template-columns:1fr 1.2fr 110px;gap:6px;align-items:center}
.brow select,.brow input{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px;background:var(--surface);color:var(--ink);min-width:0;width:100%}
.brow .ba{text-align:right;font-weight:600}
.bsum{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--accent-soft)}
.bsum b{margin-left:auto;font-size:18px}
.npad{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.npad[hidden]{display:none}
.npad button{padding:14px 0;font-size:20px;font-weight:600;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-family:inherit}
.npad button:active{background:var(--accent-soft)}
.npad .span2{grid-column:span 2}
.arow.tap{cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) 96px 136px;gap:10px;align-items:center}
.an{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:7px;vertical-align:1px}
.abar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.abar i{display:block;height:100%;border-radius:99px}
.arow-r{display:flex;align-items:baseline;justify-content:flex-end;gap:10px;min-width:0}
.pct{font-size:12.5px;color:var(--muted);min-width:36px;text-align:right}
.menu{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.menu-row{display:grid;grid-template-columns:1fr auto;column-gap:10px;row-gap:3px;align-items:center;width:100%;padding:16px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.menu-row:last-child{border-bottom:0}
.menu-row:active{background:var(--accent-soft)}
.menu-t{font-size:15px;font-weight:600}
.menu-s{grid-column:1;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{grid-column:2;grid-row:1/3;font-size:22px;line-height:1;color:var(--muted)}
.rec-total{display:flex;justify-content:space-between;align-items:baseline;padding:10px 2px;margin-top:4px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.rec-total b{color:var(--ink);font-size:15px;font-weight:700}
.fc-head{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0 8px}
.fc-month{font-size:16px;font-weight:600;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.fc-big{font-size:28px;font-weight:700;margin:6px 0 10px}
.fc-sum div{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;font-size:13.5px;color:var(--muted)}
.fc-sum b{color:var(--ink);font-weight:600}
.fc-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.rec-grp{margin-bottom:8px}
.rec-gh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:8px 2px;border-bottom:1px solid var(--line);margin-bottom:6px;cursor:pointer;list-style:none}
.rec-gh::-webkit-details-marker{display:none}
.rec-gh b{color:var(--ink);font-weight:600}
.rec-gh::after{content:"▾";margin-left:6px;transition:transform .15s}
.rec-grp:not([open]) .rec-gh::after{transform:rotate(-90deg)}
.rec-item{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--bg)}
.rec-r1{display:grid;grid-template-columns:1fr 1.4fr;gap:6px}
.rec-r2{display:grid;grid-template-columns:1fr 110px auto;gap:6px}
.rec-item select,.rec-item input{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px;background:var(--surface);color:var(--ink);min-width:0;width:100%}
.rec-item .chk{display:flex;align-items:center;gap:8px;font-size:14px;margin:2px 0 0}
.rec-item .chk input[type=checkbox]{width:18px;height:18px;margin:0;padding:0;flex:none}
.asset-gh{display:flex;justify-content:space-between;align-items:center;padding:10px 0;cursor:pointer;list-style:none;font-size:15px;border-bottom:1px solid var(--line)}
.asset-gh::-webkit-details-marker{display:none}
.asset-gh::after{content:"▾";margin-left:8px;color:var(--muted);transition:transform .15s}
details:not([open])>.asset-gh::after{transform:rotate(-90deg)}
.asset-gh .asset-gv{margin-left:auto;text-align:right;font-weight:700}
.asset-grp-d .abar{flex:1;min-width:0;overflow:hidden}
.asset-grp-d .abar i{max-width:100%}
.asset-grp-d .arow-r{flex:none;white-space:nowrap}
.alist{display:flex;flex-direction:column;max-height:60vh;overflow:auto}
.arow2{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px}
.arow2 .memo2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow2.yr{width:100%;background:none;border:0;color:inherit;text-align:left;font:inherit;cursor:pointer}
.ahd{display:flex;align-items:center;gap:8px}
.ahd h3{margin:0}
.sum-card{display:flex;flex-direction:column;gap:10px}
.sum-h{display:flex;justify-content:space-between;align-items:baseline}
.sum-list{display:flex;flex-direction:column;gap:4px}
.sum-row{display:grid;grid-template-columns:minmax(0,1fr) 56px 118px;gap:8px;align-items:center;padding:7px 10px;border-radius:10px;font-size:14px}
.sum-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sum-p{text-align:right;font-size:12.5px;color:var(--muted)}
.sum-v{text-align:right;font-weight:600}
.sum-row.warn{background:color-mix(in srgb,#e9b949 10%,transparent)}
.sum-row.over{background:color-mix(in srgb,var(--exp) 6%,transparent)}
.sum-row.over .sum-p{color:#b9573f;font-weight:600}
.cmp-grid{display:flex;flex-direction:column;gap:6px}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:10px;row-gap:2px;align-items:center;padding:9px 12px;border-radius:10px;background:var(--bg)}
.cmp-k{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.cmp .num{text-align:right}
.cmp b{font-size:15px;grid-column:2;grid-row:1}
.cmp-d{font-size:12px;color:var(--muted);grid-column:1 / span 2;grid-row:2;white-space:normal;word-break:keep-all}
.cmp-d b{font-weight:600}
.cmp-d b.up{color:var(--inc)}
.cmp-d b.down{color:var(--exp)}
#main>*{flex-shrink:0}
.sect{font-size:13px;font-weight:600;color:var(--muted);padding:6px 2px 0;letter-spacing:.02em}
details.grp{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:var(--r);overflow:hidden}
details.grp>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;background:color-mix(in srgb,var(--c) 9%,var(--surface))}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:"›";color:var(--muted);font-size:20px;line-height:1;transform:rotate(90deg);transition:transform .15s;margin-left:4px}
details.grp[open]>summary::after{transform:rotate(-90deg)}
details.grp .gt{font-size:17px;font-weight:700;color:var(--c)}
details.grp .gn{font-size:12.5px;color:var(--muted)}

.crow{display:grid;grid-template-columns:auto 1fr 150px auto;gap:3px 8px;align-items:baseline;border:0;border-bottom:1px solid var(--line);background:none;padding:7px 0;text-align:left;width:100%;color:var(--ink);cursor:pointer}

.crow .cs{grid-column:3;justify-self:end;text-align:right}

.yr-row .cv{grid-column:2;grid-row:2;justify-self:end;font-size:14px;font-weight:700;line-height:1.2}
.yr-row .cs{grid-column:1;grid-row:2;justify-self:end;text-align:right;font-size:11.5px;line-height:1.2;align-self:center;padding-right:6px}
.gbtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:30px;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--muted);white-space:nowrap;cursor:pointer}
.gbtn.on{color:var(--accent);border-color:var(--accent)}
.crow .cv{grid-column:4;justify-self:end}
.gear{display:grid;place-items:center;text-decoration:none;color:var(--muted)}
.hero{display:flex;flex-direction:column;gap:4px;padding:18px 16px}

.minis{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:13.5px;color:var(--muted)}

.bal-avg{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.minis .mini{display:flex;flex-direction:column;gap:1px}
.minis small{font-size:11.5px;color:var(--muted);opacity:.85;padding-left:12px}

details.fold summary>span:first-child{flex:1}

details.fold[open] summary::after{transform:rotate(-90deg)}
.fold-b{padding:0 14px 14px}
.slim{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--accent-soft);border-radius:var(--r);padding:10px 12px;font-size:14px}
.bigsearch{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;font-size:16px;color:var(--ink)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:4px 0}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body>
<div class="app">
  <header class="top"><h1 id="title">우리집 가계부</h1><span class="sync" id="sync">불러오는 중…</span><button class="icon-btn gear" id="refresh" type="button" aria-label="시트에서 새로 불러오기">⟳</button><a class="icon-btn gear" href="#settings" aria-label="설정">⚙</a></header>
  <main id="main"><div class="empty">가계부를 불러오는 중입니다…</div></main>
</div>
<button class="fab" id="fab" type="button">＋ 입력</button>
<nav class="tabs"><div class="in">
  <a href="#month" data-v="month">월간</a>
  <a href="#list" data-v="list">상세</a>
  <a href="#stats" data-v="stats">통계</a>
  <a href="#assets" data-v="assets">자산</a>
</div></nav>
<dialog id="dlg"></dialog>

<script>
"use strict";
const TYPES = ["변동지출","고정지출","수입","재테크","자산이동"];
const OUT = new Set(["변동지출","고정지출"]);
// 기초자산(현재 값)의 기준일: 이 날짜 이전 내역은 자산 잔액에 반영하지 않습니다 (통계는 그대로)
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won = n => { const v=Math.round(n||0); return (v<0?"-":"")+"₩"+Math.abs(v).toLocaleString("ko-KR"); };
const wonS = n => { const a=Math.abs(n||0), s=n<0?"-₩":"₩"; if(a>=1e8) return s+(a/1e8).toFixed(a>=1e9?1:2).replace(/\.?0+$/,"")+"억"; if(a>=1e4) return s+Math.round(a/1e4).toLocaleString("ko-KR")+"만"; return s+Math.round(a).toLocaleString("ko-KR"); };
const parseAmt = s => { const v = Number(String(s).replace(/[^\d.-]/g,"")); return isFinite(v) ? v : NaN; };
const pad = n => String(n).padStart(2,"0");
const today = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const ymOf = d => d.slice(0,7);
const addYM = (ym,k) => { let [y,m]=ym.split("-").map(Number); m+=k; while(m>12){m-=12;y++} while(m<1){m+=12;y--} return `${y}-${pad(m)}`; };
const ymDiff = (a,b) => { const [y1,m1]=a.split("-").map(Number),[y2,m2]=b.split("-").map(Number); return (y2-y1)*12+(m2-m1); };
const DOW = ["일","월","화","수","목","금","토"];
const newId = () => { const a=new Uint8Array(4); crypto.getRandomValues(a); const h=[...a].map(x=>x.toString(16).padStart(2,"0")).join(""); return "abcdf"[a[0]%5]+h.slice(1); }; // 첫 글자를 영문으로: 시트가 숫자로 바꾸지 않게
const CONF = window.GAGYEBU || {};

const S = {
  db:false, canWrite:true, me:null, tx:[],
  months:{}, loaded:false, cfg:null, cfgLoaded:false, loadedAt:0,
  view:"month", ym: ymOf(today()),
  f:{period:"thisMonth", from:"", to:"", t:"", c:"", q:"", limit:200},
  statYear: new Date().getFullYear(),
  _all:null, sel:null, statCat:null, statGrp:null, mt:"", open:new Set(), shut:new Set(), gs:{}, fs:{}, setSec:null, hideAvg:(()=>{ try{ return localStorage.getItem("gb-hideavg")!=="0"; }catch{ return true; } })()
};
function rebuild(){ const m={}; for(const e of S.tx){ (m[ymOf(e.d)] ||= []).push(e); } S.months=m; S._all=null; }
function all(){
  if (S._all) return S._all;
  const out=S.tx.slice(); out.sort((a,b)=> a.d<b.d?1:a.d>b.d?-1:0);
  return S._all = out;
}
const cfg = () => S.cfg || {categories:[], recurring:[], base:[]};
const catsOf = t => cfg().categories.filter(x=>x.t===t);
function sumBy(list){ const s={수입:0,변동지출:0,고정지출:0,재테크:0}; for(const e of list) if(s[e.t]!==undefined) s[e.t]+=e.a; return s; }
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
const setSync = t => { $("#sync").textContent=t; };

/* ---------- 구글 로그인 ---------- */
let TOKEN=null, EXP=0, waiters=[], SESS=null, sessBusy=false;
function parseJwt(t){ const b=t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"); return JSON.parse(decodeURIComponent(escape(atob(b)))); }
function gisReady(){ return new Promise((res,rej)=>{ const t0=Date.now(); (function w(){ if(window.google&&google.accounts&&google.accounts.id) res(); else if(Date.now()-t0>15000) rej(new Error("gis")); else setTimeout(w,100); })(); }); }
function initAuth(){
  try{ SESS=localStorage.getItem("gb-sess")||null; }catch{}
  try{ const t=localStorage.getItem("gb-tok"); if(t){ const p=parseJwt(t); if(p.exp*1000>Date.now()+120000){ TOKEN=t; EXP=p.exp*1000; } } }catch{}
  google.accounts.id.initialize({ client_id:CONF.CLIENT_ID, auto_select:true, cancel_on_tap_outside:false, use_fedcm_for_prompt:true,
    callback:r=>{ TOKEN=r.credential; EXP=parseJwt(TOKEN).exp*1000; try{ localStorage.setItem("gb-tok",TOKEN); }catch{} hideLogin(); makeSession(TOKEN); waiters.splice(0).forEach(f=>f(TOKEN)); } });
}
function makeSession(idTok){
  if(sessBusy) return; sessBusy=true;
  fetch(CONF.API_URL,{method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({action:"session", token:idTok})})
    .then(r=>r.json()).then(j=>{ if(j.ok){ SESS=j.data.session; localStorage.setItem("gb-sess",SESS); } }).catch(()=>{}).finally(()=>{ sessBusy=false; });
}
function getToken(){
  if(SESS) return Promise.resolve(SESS);
  if(TOKEN && Date.now()<EXP-120000){ makeSession(TOKEN); return Promise.resolve(TOKEN); }
  TOKEN=null;
  return new Promise(res=>{ waiters.push(res);
    if(waiters.length===1){ try{ google.accounts.id.prompt(); }catch{} setTimeout(()=>{ if(!TOKEN) showLogin(); },2500); } });
}
function showLogin(){
  if($("#login")) return;
  const d=document.createElement("div"); d.id="login"; d.className="login";
  d.innerHTML=`<div class="login-card"><h2>우리집 가계부</h2><p>가족 구글 계정으로 로그인하세요.<br>사용자관리 시트에 등록된 계정만 들어올 수 있어요.</p><div id="gbtn"></div></div>`;
  document.body.appendChild(d);
  google.accounts.id.renderButton($("#gbtn"),{theme:"outline", size:"large", text:"signin_with", shape:"pill", locale:"ko"});
}
function hideLogin(){ const d=$("#login"); if(d) d.remove(); }
function logout(){ if(SESS) fetch(CONF.API_URL,{method:"POST", body:JSON.stringify({action:"logout", token:SESS})}).catch(()=>{}); try{ google.accounts.id.disableAutoSelect(); localStorage.removeItem("gb-tok"); localStorage.removeItem("gb-sess"); localStorage.removeItem("gb-cache"); }catch{} TOKEN=null; SESS=null; location.hash="#month"; location.reload(); }

/* ---------- 시트 API ---------- */
async function api(action, body={}, retried){
  const token=await getToken();
  let j;
  try{
    const r=await fetch(CONF.API_URL,{method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({action, token, ...body})});
    j=await r.json();
  }catch(e){ throw Object.assign(new Error("인터넷 연결을 확인해 주세요"),{code:0}); }
  if(!j.ok){
    if(j.code===401 && !retried){ TOKEN=null; EXP=0; SESS=null; try{ localStorage.removeItem("gb-tok"); localStorage.removeItem("gb-sess"); }catch{} return api(action, body, true); }
    throw Object.assign(new Error(j.error||"요청이 실패했어요"),{code:j.code});
  }
  return j.data;
}
let chain=Promise.resolve(), pending=0;
function queue(action, body){
  pending++; setSync("저장 중…");
  const p = chain.then(()=>api(action, body));
  chain = p.catch(()=>{});
  return p.finally(()=>{ pending--; if(!pending) setSync("저장됨"); });
}
function saveCache(){ try{ localStorage.setItem("gb-cache", JSON.stringify({tx:S.tx, ...cfg(), plan:S.plan||[], me:S.me})); }catch{} }
function applyData(d){
  S.loan=d.loan||S.loan||{rate:0,monthly:0,auto:false}; S.tx=d.tx||[]; S.cfg={categories:d.categories||[], recurring:d.recurring||[], base:d.base||[]}; S.plan=d.plan||[]; S.me=d.me||S.me;
  S.cfgLoaded=true; S.loaded=true; S.db=true; rebuild(); render();
}
async function loadAll(manual){
  setSync("불러오는 중…");
  try{ const d=await api("load"); applyData(d); S.loadedAt=Date.now(); saveCache(); setSync("동기화됨"); if(manual) toast("시트에서 새로 불러왔어요"); }
  catch(e){
    setSync("연결 안 됨");
    if(e.code===403){ hideLogin(); $("#main").innerHTML=`<div class="card"><h2>등록되지 않은 계정이에요</h2><p class="small">${esc(e.message)}. 구글 시트의 사용자관리 시트에 이메일과 가족코드를 넣은 뒤 다시 열어 주세요.</p><p><button class="btn" type="button" onclick="logout()">다른 계정으로 로그인</button></p></div>`; return; }
    if(!S.loaded) $("#main").innerHTML=`<div class="card empty">${esc(e.message)}<p><button class="btn" type="button" onclick="loadAll(true)">다시 시도</button></p></div>`;
    else toast(e.message);
  }
}
function writeErr(e){ toast((e&&e.message)||"저장하지 못했어요"); loadAll(); }
async function putEntries(entries){
  S.tx.push(...entries); rebuild(); render(); saveCache();
  await queue("add",{items:entries});
}
async function updateEntry(ent){
  const i=S.tx.findIndex(x=>x.id===ent.id); if(i>=0) S.tx[i]=ent; rebuild(); render(); saveCache();
  await queue("update",{item:ent});
}
async function removeEntry(e){
  S.tx=S.tx.filter(x=>x.id!==e.id); rebuild(); render(); saveCache();
  await queue("remove",{id:e.id});
}
async function savePart(key, action, list){
  S.cfg={...cfg(), [key]:list}; render();
  try{ const fresh=await queue(action,{items:list}); S.cfg={...cfg(), [key]:fresh}; saveCache(); render(); toast("시트에 저장했어요"); }
  catch(e){ writeErr(e); }
}

/* ---------- 시작 ---------- */
async function boot(){
  try{ const y=sessionStorage.getItem("gb-ym"); if(/^\d{4}-\d{2}$/.test(y||"")) S.ym=y; }catch{}
  window.addEventListener("hashchange", route);
  $("#fab").onclick = ()=>openEntry(null);
  $("#refresh").onclick = ()=>loadAll(true);
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && S.loaded && Date.now()-S.loadedAt>60000) loadAll(); });
  if(!CONF.API_URL || !CONF.CLIENT_ID || /여기에/.test(CONF.API_URL+CONF.CLIENT_ID)){
    $("#main").innerHTML=`<div class="card"><h2>설정이 아직 안 됐어요</h2><p class="small">config.js 파일에 앱스 스크립트 웹 앱 주소(API_URL)와 OAuth 클라이언트 ID(CLIENT_ID)를 넣어 주세요.</p></div>`; setSync(""); return; }
  try{ const c=JSON.parse(localStorage.getItem("gb-cache")||"null"); if(c&&c.tx){ applyData(c); setSync("저장된 데이터"); } }catch{}
  route();
  try{ await gisReady(); }catch{ $("#main").innerHTML=`<div class="card empty">구글 로그인을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</div>`; return; }
  initAuth(); loadAll();
}
function route(){
  const v=(location.hash||"#month").slice(1);
  S.view = ["month","list","stats","assets","settings"].includes(v)?v:"month";
  if(S.view!=="settings") S.setSec=null;
  document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current", a.dataset.v===S.view?"page":"false"));
  render(); $("#main").scrollTop=0;
}
function render(){
  try{ sessionStorage.setItem("gb-ym", S.ym); }catch{}
  const main=$("#main");
  $("#fab").style.display = (S.db && S.view!=="settings") ? "" : "none";
  if(!S.db) return;
  main.innerHTML = ({month:vMonth, list:vList, stats:vStats, assets:vAssets, settings:vSettings})[S.view]();
  bind();
}

/* ---------- 월간 ---------- */
function monthList(ym){ return (S.months[ym]||[]).slice().sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:0); }
function cashNow(){ const c=assetNow().find(x=>x.cash); return c?c.now:0; }
/* 고정항목 중 이 달에 아직 없는 것 (이름·상세내역 기준) */
function recMissing(list){ return cfg().recurring.filter(x=>x.c && !list.some(e=>e.t===x.t && e.c===x.c && (e.m||e.c)===(x.m||x.c))); }
/* 상세내역이 같은 과거 내역에서 가장 많이 쓴 거래형태·카테고리 */
function suggestCat(m){
  const key=(m||"").trim().toLowerCase(); if(!key) return null;
  const cnt={}; for(const x of all()){ if((x.m||"").trim().toLowerCase()===key){ const k=x.t+"|"+x.c; cnt[k]=(cnt[k]||0)+1; } }
  const best=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0]; if(!best) return null;
  const i=best[0].indexOf("|"); return {t:best[0].slice(0,i), c:best[0].slice(i+1)};
}
/* 지난달 요약: 지난해 같은 달 평균(작년 월평균) 대비 */
function prevCard(ym){
  const pY=addYM(ym,-1), list=monthList(pY); if(!list.length) return "";
  const P=prevAvgs(pY), s=sumBy(list), out=s.변동지출+s.고정지출;
  const cats={}; for(const e of list) if(OUT.has(e.t) && e.t!=="고정지출"){ const k=e.t+"|"+e.c; cats[k]=(cats[k]||0)+e.a; }
  const items=Object.entries(cats).map(([k,v])=>{ const i=k.indexOf("|"), avg=P.avg[k]||0; return {c:k.slice(i+1), v, pct: avg?Math.round(v/avg*100):null}; })
    .sort((a,b)=>(b.pct??-1)-(a.pct??-1) || b.v-a.v);
  const lbl=`${pY.slice(0,4)}년 ${+pY.slice(5)}월`;
  return fold("m-prev","지난달 요약",lbl,`<div class="sum-card">
    <div class="cmp-grid">${[
      ["수입", s.수입, P.tavg["수입"]||0, "--inc", false],
      ["지출", out, (P.tavg["변동지출"]||0)+(P.tavg["고정지출"]||0), "--exp", true],
      ["재테크", s.재테크, P.tavg["재테크"]||0, "--inv", false]
    ].map(([k,v,av,col,overBad])=>{ const d=v-av; const bad=av&&(overBad?d>0:d<0);
      const sub=S.hideAvg?"":av? `평균 ${wonS(av)} · <b class="${d>=0?"up":"down"}">${d>=0?"+":"−"}${wonS(Math.abs(d))}</b>` : "평균 없음";
      return `<div class="cmp"><span class="cmp-k"><i class="dot" style="background:var(${col})"></i>${k}</span><b class="num">${won(v)}</b><span class="cmp-d num">${sub}</span></div>`; }).join("")}</div>
    <div class="sum-list">${items.slice(0,6).map(r=>{ const band=(S.hideAvg||r.pct===null)?"":(r.pct>120?"over":r.pct>=90?"warn":""); return `<div class="sum-row ${band}"><span class="sum-n">${esc(r.c)}</span><span class="sum-p num">${(S.hideAvg||r.pct===null)?"":r.pct+"%"}</span><span class="sum-v num">${won(r.v)}</span></div>`; }).join("")}</div>
    <p class="note">${esc(P.label)} 대비 · 120%를 넘으면 빨강, 90%를 넘으면 노랑으로 표시해요.</p></div>`,false);
}

/* 앱시트 '월별 평균' 규칙: 지난 해는 ÷12, 1월이면 작년 ÷12, 그 외에는 지난달까지 합 ÷ (이번 달−1) */
function monthAvg(t, c, Y){
  const now=new Date(), cy=now.getFullYear(), cm=now.getMonth()+1;

  if(Y<cy){ for(const e of all()) if(e.t===t&&e.c===c&&+e.d.slice(0,4)===Y) s+=e.a; return Math.round(s/12); }
  if(cm===1){ for(const e of all()) if(e.t===t&&e.c===c&&+e.d.slice(0,4)===Y-1) s+=e.a; return Math.round(s/12); }
  for(const e of all()) if(e.t===t&&e.c===c&&+e.d.slice(0,4)===Y&&+e.d.slice(5,7)<cm) s+=e.a;
  return Math.round(s/(cm-1));
}

function periodRange(){

function trendChart(Ys){
  const W=680,H=250,L=52,B=24,T=10, n=Ys.length, cw=(W-L-6)/n;
  const bars=[["수입",r=>r.수입,"--inc"],["지출",r=>r.고정지출+r.변동지출,"--exp"],["재테크",r=>r.재테크,"--inv"],["순수익",r=>r.net,"--ink"]];
  const vals=Ys.flatMap(r=>[r.acc, ...bars.map(b=>b[1](r))]);
  const max=Math.max(1,...vals), min=Math.min(0,...vals);
  const stepRaw=(max-min)/4, mag=Math.pow(10,Math.floor(Math.log10(stepRaw||1))), step=Math.ceil(stepRaw/mag)*mag;
  const lo=Math.floor(min/step)*step, hi=lo+step*Math.max(4,Math.ceil((max-lo)/step));

  for(let v=lo; v<=hi+1; v+=step){ const y=yv(v); s+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${wonS(v)}</text>`; }
  const bw=cw*0.8/bars.length;

      s+=`<rect x="${x+1}" y="${Math.min(y0,y1)}" width="${Math.max(2,bw-2)}" height="${Math.max(1,Math.abs(y1-y0))}" rx="2" fill="var(${col})" opacity="${col==="--ink"?".5":".85"}"><title>${r.y}년 ${nm} ${won(v)}</title></rect>`; });
    s+=`<text x="${L+i*cw+cw/2}" y="${H-6}" text-anchor="middle">${r.y}</text>`; });
  const pts=Ys.map((r,i)=>`${L+i*cw+cw/2},${yv(r.acc)}`).join(" ");

  Ys.forEach((r,i)=>{ const last=i===n-1; s+=`<circle cx="${L+i*cw+cw/2}" cy="${yv(r.acc)}" r="${last?5:3.5}" fill="var(--accent)"><title>${r.y}년 누적 자산 ${won(r.acc)}</title></circle>`;
    if(last) s+=`<text x="${L+i*cw+cw/2}" y="${yv(r.acc)-10}" text-anchor="end" style="fill:var(--ink);font-weight:600">${wonS(r.acc)}</text>`; });
  return s+`</svg>`;
}
function barChart(mon, single, avg, color, noHits){

  const stepRaw=max/4, mag=Math.pow(10,Math.floor(Math.log10(stepRaw))), step=Math.ceil(stepRaw/mag)*mag, top=step*4;

    [["in","--inc"],["out","--exp"],["inv","--inv"]].forEach(([k,c],j)=>{ const v=m[k]; if(v>0) s+=`<rect x="${x+j*bw}" y="${yv(v)}" width="${bw-2}" height="${yv(0)-yv(v)}" rx="2" fill="var(${c})"><title>${i+1}월 ${({in:"수입",out:"지출",inv:"재테크"})[k]} ${won(v)}</title></rect>`; });

function assetNow(){
  // 자산 잔액: 기초자산(기록 시작 시점 값) + 전체 기록 ~ 오늘까지
  const td=today(), base=cfg().base, rows=all().filter(e=>e.d<=td), inv={}; let cash=0;
  for(const e of rows){
    if(e.t==="자산이동"){ const [f,t]=(e.c||"").split(">"); if(!f||!t) continue;
      if(f==="현금") cash-=e.a; else inv[f]=(inv[f]||0)-e.a;
      if(t==="현금") cash+=e.a; else inv[t]=(inv[t]||0)+e.a; continue; }
    if(e.t==="재테크") inv[e.c]=(inv[e.c]||0)+e.a;
    cash += e.t==="수입" ? e.a : -e.a; }
  const names=[...new Set(base.map(b=>b.n).filter(n=>n!=="현금").concat(Object.keys(inv)))];
  const items=names.map(n=>{ const b=(base.find(x=>x.n===n)||{}).a||0; return {n, base:b, add:inv[n]||0, now:b+(inv[n]||0)}; });
  const cb=(base.find(x=>x.n==="현금")||{}).a||0;
  items.unshift({n:"현금", base:cb, add:cash, now:cb+cash, cash:true});
  return items;
}

const dlg=$("#dlg");

function closeDlg(){ hidePad(); const b=dlgBack; dlgBack=null; if(b){ b(); return; } dlg.close(); dlg.innerHTML=""; }
dlg.addEventListener("close",()=>{ dlgBack=null; });
let downOnBackdrop=false;
dlg.addEventListener("pointerdown",e=>{ downOnBackdrop=e.target===dlg; });
dlg.addEventListener("cancel",e=>{ if(padEl && !padEl.hidden){ e.preventDefault(); hidePad(); } });
dlg.addEventListener("click",e=>{ if(e.target===dlg && downOnBackdrop) closeDlg(); });
/* 금액 칸을 누르면 앱 안의 숫자 패드가 뜨고, 다른 칸을 누르면 사라져요 */
const NPAD_KEYS=[["1","1"],["2","2"],["3","3"],["⌫","bk"],["4","4"],["5","5"],["6","6"],["−","neg"],["7","7"],["8","8"],["9","9"],["00","00"],["0","0","span2"],["완료","done","span2"]];
let padEl=null, padFor=null;
function showPad(input){ if(!padEl) return; padFor=input; padEl.hidden=false; }
function hidePad(){ if(padEl) padEl.hidden=true; padFor=null; }
/* 숫자 패드 키 처리 (화면 패드와 블루투스 키보드가 같이 씀) */
function padPress(k){
  if(!padFor) return;
  if(k==="done"){ hidePad(); return; }
  const v=parseAmt(padFor.value); let n=isNaN(v)?0:v;
  if(k==="neg") n=-n;
  else { const neg=n<0, a=Math.abs(n); const m=k==="bk"?Math.floor(a/10):k==="00"?a*100:a*10+Number(k); if(m>1e12) return; n=neg?-m:m; }
  padFor.value=n?won(n):"";
  padFor.dispatchEvent(new Event("input",{bubbles:true}));
}
function attachPad(){
  padFor=null; padEl=document.createElement("div"); padEl.className="npad"; padEl.hidden=true;
  padEl.innerHTML=NPAD_KEYS.map(([l,k,c])=>`<button type="button" data-k="${k}"${c?` class="${c}"`:""}>${l}</button>`).join("");
  padEl.addEventListener("pointerdown",e=>e.preventDefault());
  padEl.addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) padPress(b.dataset.k); });
  dlg.appendChild(padEl);
}
dlg.addEventListener("focusin",e=>{
  if(padEl && padEl.contains(e.target)) return;
  if(e.target.hasAttribute&&e.target.hasAttribute("data-num")) showPad(e.target); else hidePad();
});
dlg.addEventListener("click",e=>{ if(e.target.hasAttribute&&e.target.hasAttribute("data-num")) showPad(e.target); });
/* 블루투스 키보드: 금액 칸에서 숫자·Backspace·-·Enter 를 패드와 같게 처리 */
dlg.addEventListener("keydown",e=>{
  const t=e.target; if(!(t.hasAttribute&&t.hasAttribute("data-num"))) return;
  const k=e.key; let map=null;
  if(/^[0-9]$/.test(k)) map=k;
  else if(k==="Backspace") map="bk";
  else if(k==="-"||k==="Subtract") map="neg";
  else if(k==="Enter") map="done";
  if(map===null) return;
  e.preventDefault(); showPad(t); padPress(map);
});

  const list=all().filter(e=>e.t==="자산이동").sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:0);
  const years=[...new Set(list.map(e=>+e.d.slice(0,4)))].sort((a,b)=>b-a);
  const y=yArg||years[0]||new Date().getFullYear();
  const cur=list.filter(e=>+e.d.slice(0,4)===y);
  const rowsH=cur.map(e=>`<button type="button" class="arow2 yr" data-edit="${esc(e.id)}"><span class="small muted">${esc(e.d.slice(2).replace(/-/g,"."))}</span><span class="memo2">${esc((e.c||"").replace(">"," → "))}${e.m?` · ${esc(e.m)}`:""}</span><span class="num" style="font-weight:600;color:var(--ink)">${won(e.a)}</span></button>`).join("");
  const yBtns=years.map(v=>`<button type="button" class="btn sm${v===y?" primary":""}" data-ay="${v}">${v}년</button>`).join("");
  dlg.innerHTML=`<div class="dlg"><h3>자산이동 내역</h3><div class="pills" role="group" style="flex-wrap:wrap">${yBtns||""}</div>
    <div class="small muted">${y}년 · ${cur.length}건 · 누르면 수정할 수 있어요</div>
    <div class="alist">${rowsH||'<p class="small muted">이 해의 자산이동 내역이 없어요.</p>'}</div>
    <div class="acts"><span class="grow"></span><button type="button" class="btn" id="am-close">닫기</button></div></div>`;
  dlg.querySelectorAll("[data-ay]").forEach(b=>b.onclick=()=>openAssetMoves(+b.dataset.ay));
  dlg.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{ const e=list.find(x=>x.id===b.dataset.edit); if(e){ dlgBack=()=>openAssetMoves(y); openEntry(e); } });
  $("#am-close").onclick=closeDlg;
  if(!dlg.open) dlg.showModal();
}
function openAsset(n){
  const td=today(), isCash=n==="현금";
  const inv_=e=>(e.c||"").split(">").includes(n);
  const list=all().filter(e=>e.d<=td && (e.t==="자산이동" ? inv_(e) : (isCash || (e.t==="재테크" && e.c===n))));
  const it=assetNow().find(x=>x.n===n)||{base:0,now:0};
  const sign=e=> e.t==="자산이동" ? ((e.c||"").split(">")[0]===n ? -e.a : e.a) : (isCash?(e.t==="수입"?e.a:-e.a):e.a);
  const years=[...new Set(list.map(e=>+e.d.slice(0,4)))].sort((a,b)=>b-a);
  const amt=v=>`<span class="num" style="font-weight:600;color:var(${v<0?"--exp":"--inc"})">${v>0?"+":""}${won(v)}</span>`;
  const drawYears=()=>{

      <div class="alist">${years.length?years.map(y=>`<button type="button" class="arow2 yr" data-y="${y}"><span>${y}년</span><span></span>${amt(tot[y])}</button>`).join(""):'<p class="small muted">내역이 없어요.</p>'}</div>

    $("#as-back").onclick=drawYears; $("#as-close").onclick=closeDlg;
    dlg.querySelectorAll("[data-aedit]").forEach(b=>b.onclick=()=>{ const e=all().find(x=>x.id===b.dataset.aedit); if(e){ dlgBack=()=>drawYear(y); openEntry(e); } });

function planSigned(p){ return p.t==="수입" ? p.a : -p.a; }
function recSigned(x){ return x.t==="수입" ? x.a : -x.a; }
function forecastCalc(ym){
  const cur=ymOf(today()), td=today();
  const plans=(S.plan||[]).filter(p=>p.d>td && p.d.slice(0,7)<=ym).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  const planSum=plans.reduce((a,p)=>a+(p.t==="수입"?p.a:-p.a),0);
  // 고정항목은 자동으로 예상 금액이 되고, 같은 카테고리의 카테고리 예상금액보다 우선합니다 (중복 방지)
  const fixed={}; for(const x of cfg().recurring){ if(!x.c) continue; const k=x.t+"|"+x.c; fixed[k]=(fixed[k]||0)+(+x.a||0); }
  const bud={}; for(const x of cfg().categories){ if(x.b>0) bud[x.t+"|"+x.c]=+x.b; }
  const keys=new Set([...Object.keys(fixed), ...Object.keys(bud)]);
  const expOf=k=> fixed[k]!==undefined ? fixed[k] : (bud[k]||0);
  const sg=k=> k.split("|")[0]==="수입" ? 1 : -1;
  // 이번 달: 예상 금액에서 이미 입력한 금액을 뺀 나머지만 반영 (아직 입력 안 된 고정항목도 포함)
  const spent={}; for(const e of monthList(cur)){ const k=e.t+"|"+e.c; spent[k]=(spent[k]||0)+e.a; }
  let remainNow=0; for(const k of keys) remainNow+=sg(k)*Math.max(0, expOf(k)-(spent[k]||0));
  // 이후 달: 예상 금액 전액을 매달 반영
  let futureMonths=0; for(let m=addYM(cur,1); m<=ym; m=addYM(m,1)) futureMonths++;
  let perMonth=0; for(const k of keys) perMonth+=sg(k)*expOf(k);
  const budSum=(ym>=cur ? remainNow : 0) + futureMonths*perMonth;
  const cash=cashNow();
  return {plans, planSum, budSum, cash, total: cash+planSum+budSum};
}

    <div class="fc-sum">
      <div><span>현재 현금 잔고</span><b class="num">${won(f.cash)}</b></div>
      <div><span>예상 수입·지출 (고정항목·예상금액 기준)</span><b class="num">${won(f.budSum)}</b></div>

  dlg.innerHTML=`<form class="dlg" id="rf2"><h3>고정항목 추가</h3>
    <label class="field">거래형태<select id="ra-t">${TYPES.map(t=>`<option${t==="고정지출"?" selected":""}>${t}</option>`).join("")}</select></label>
    <label class="field">카테고리<select id="ra-c">${recCatOpts("고정지출","")}</select></label>
    <label class="field">상세내역<input type="text" id="ra-m" placeholder="예: 통신비 · 폰(용)"></label>
    <label class="field">금액<input type="text" inputmode="none" readonly data-num="1" id="ra-amt" value="₩0" class="num" style="text-align:right"></label>
    <div class="acts"><span class="grow"></span><button type="button" class="btn" id="ra-cancel">닫기</button><button type="submit" class="btn primary">추가</button></div></form>`;
  $("#ra-t").onchange=()=>{ $("#ra-c").innerHTML=recCatOpts($("#ra-t").value,""); };
  $("#ra-cancel").onclick=closeDlg;
  $("#rf2").onsubmit=ev=>{ ev.preventDefault();
    const t=$("#ra-t").value, c=$("#ra-c").value, m=$("#ra-m").value.trim(), a=parseAmt($("#ra-amt").value)||0;
    if(!c){ toast("카테고리를 골라 주세요"); return; }
    closeDlg(); S.cfg={...cfg(), recurring:[...readRec(), {id:"", t, c, m:m||c, a}]}; render(); };
  attachPad();
  if(!dlg.open) dlg.showModal();
}
function openRecurring(){
  const rec=cfg().recurring, d0=S.ym+"-01";
  dlg.innerHTML=`<form class="dlg" id="rf"><h3>고정항목 일괄입력</h3>
    <label class="field">입력할 날짜<input type="date" id="r-d" value="${d0}"></label>
    <div class="reclist">${rec.map((x,i)=>`<label><input type="checkbox" id="rc-${i}" checked><span><span class="chip t-${esc(x.t)}">${esc(x.c)}</span> ${esc(x.m)}</span><input type="text" inputmode="none" readonly data-num="1" id="rv-${i}" value="${won(x.a)}" class="num" aria-label="${esc(x.m)} 금액"></label>`).join("")}</div>
    <div class="acts"><span class="grow small muted" id="r-sum"></span><button type="button" class="btn" id="r-cancel">닫기</button><button type="submit" class="btn primary">입력하기</button></div></form>`;
  const upd=()=>{ let n=0,s=0; rec.forEach((x,i)=>{ if($("#rc-"+i).checked){ n++; s+=parseAmt($("#rv-"+i).value)||0; } }); $("#r-sum").textContent=`${n}건 · ${won(s)}`; };
  dlg.querySelectorAll("input").forEach(i=>i.addEventListener("input",upd)); upd();
  $("#r-cancel").onclick=closeDlg;
  $("#rf").onsubmit=async ev=>{ ev.preventDefault(); const d=$("#r-d").value; if(!d) return;
    const w=S.me?S.me.email.split("@")[0]:"";
    const ents=rec.map((x,i)=>$("#rc-"+i).checked?{id:newId(), d, t:x.t, c:x.c, m:x.m, a:parseAmt($("#rv-"+i).value)||0, w}:null).filter(e=>e&&e.a);
    closeDlg(); S.ym=ymOf(d); try{ await putEntries(ents); toast(`${ents.length}건 입력했어요`); render(); }catch(x){ writeErr(x); } };
  attachPad();
  dlg.showModal();
}
boot();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
